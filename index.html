<title>La movilidad de Málaga en directo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mapa en 3D a pantalla completa; un panel flotante resume la ciudad y hace de leyenda y de control de capas. */
:root {
  --bg: #e9eeee;
  --panel: #ffffff;
  --panel-2: #f2f5f5;
  --ink: #13222c;
  --muted: #586973;
  --line: #d6dee0;
  --accent: #0b6f6a;
  --good: #16794a;
  --warn: #b26a00;
  --bad: #c43a3a;
  --cam: #44586c;
  --stop: #13222c;
  --stop-fill: #ffffff;
  --on-color: #ffffff;
  --edificio: #cfd6d8;
  --shadow: 0 6px 24px rgba(19, 34, 44, .16);
  --font: Matter, "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d; --panel: #16222b; --panel-2: #1d2c37; --ink: #e9eff2; --muted: #96a6b0;
    --line: #2b3b47; --accent: #3cc4b9; --good: #4ccb8b; --warn: #f0ab3c; --bad: #ff7a70;
    --cam: #9fb3c6; --stop: #e9eff2; --stop-fill: #16222b; --on-color: #0e171d; --edificio: #2c3a46;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d; --panel: #16222b; --panel-2: #1d2c37; --ink: #e9eff2; --muted: #96a6b0;
  --line: #2b3b47; --accent: #3cc4b9; --good: #4ccb8b; --warn: #f0ab3c; --bad: #ff7a70;
  --cam: #9fb3c6; --stop: #e9eff2; --stop-fill: #16222b; --on-color: #0e171d; --edificio: #2c3a46;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.35; overflow: hidden; }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }

/* ---------- Panel ---------- */
#panel {
  position: absolute; z-index: 5;
  top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px));
  width: 348px; max-height: calc(100% - 28px);
  display: flex; flex-direction: column; gap: 14px;
  padding: 18px 18px 14px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
h1 { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
#status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-height: 18px; }
#dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
#status.live #dot { background: var(--good); animation: pulse 2s infinite; }
#status.late #dot { background: var(--warn); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }

#layers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.layer {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center; text-align: left;
  padding: 10px 11px; background: var(--panel-2); border: 1px solid transparent; border-radius: 10px; cursor: pointer;
}
.layer:hover { border-color: var(--line); }
.layer .big { grid-column: 1 / -1; font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.layer .lbl { font-size: 12.5px; color: var(--muted); }
.layer .sw { width: 12px; height: 12px; flex: none; }
.layer[aria-pressed="false"] { background: transparent; border-color: var(--line); }
.layer[aria-pressed="false"] .big, .layer[aria-pressed="false"] .lbl { color: var(--muted); opacity: .7; text-decoration: line-through; text-decoration-thickness: 1px; }
.layer[aria-pressed="false"] .sw { opacity: .35; }
.sw-bus { border-radius: 4px; background: var(--accent); }
.sw-park { border-radius: 3px; background: var(--good); }
.sw-corte { background: var(--bad); transform: rotate(45deg) scale(.85); border-radius: 2px; }
.sw-cam { border-radius: 50%; border: 3px solid var(--cam); }
.sw-stop { border-radius: 50%; border: 2px solid var(--stop); background: var(--stop-fill); width: 10px; height: 10px; }
.layer.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr auto; }
.layer.wide .lbl { color: var(--ink); }
.layer.wide .hint { font-size: 12px; color: var(--muted); }

.row { display: flex; align-items: center; gap: 8px; }
.row label { font-size: 12.5px; color: var(--muted); flex: none; }
#lineSel { flex: 1; min-width: 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
#lineClear { padding: 8px 10px; background: transparent; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
#lineInfo { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

#clima { display: grid; gap: 7px; padding-top: 12px; border-top: 1px solid var(--line); }
#clima .c { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
#clima .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
#clima b { font-weight: 600; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 600; color: var(--on-color); background: var(--muted); }

#foot { font-size: 11.5px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
#foot a { color: inherit; }
#more { display: none; }

/* ---------- Marcadores ---------- */
.mk { cursor: pointer; }
.bus {
  display: flex; align-items: center; justify-content: center; height: 20px; min-width: 24px; padding: 0 5px;
  border-radius: 6px; border: 1.5px solid var(--panel); background: var(--c); color: var(--t, #fff);
  font: 700 11.5px/1 var(--font); letter-spacing: -.01em; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); white-space: nowrap;
  transition: opacity .3s;
}
.bus-ic.dim .bus { opacity: .14; }
.bus-ic.still .bus { border-style: dashed; }
.park {
  display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px 0 3px; border-radius: 7px;
  background: var(--c); color: var(--on-color); border: 1.5px solid var(--panel); box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
  font: 700 12px/1 var(--font); white-space: nowrap;
}
.park i { font-style: normal; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; background: var(--on-color); color: var(--c); font-size: 11.5px; }
.corte { width: 13px; height: 13px; background: var(--c); border: 1.5px solid var(--panel); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.corte.futuro { background: var(--panel); border-color: var(--c); }
.hide-buses .bus-ic, .hide-park .park-ic, .hide-cortes .corte-ic { display: none; }

<div id="app">
  <div id="map" aria-label="Mapa de Málaga"></div>

  <section id="panel" aria-label="Resumen y capas">
    <button id="more" type="button" aria-expanded="false">Más</button>
    <h1>La movilidad de Málaga <em>en directo</em></h1>
    <div id="status" role="status"><span id="dot"></span><span id="statusText">Cargando datos…</span></div>

    <div id="layers">
      <button class="layer" type="button" data-layer="buses" aria-pressed="true">
        <span class="big num" id="nBuses">–</span><span class="sw sw-bus"></span><span class="lbl">Autobuses</span>
      </button>
      <button class="layer" type="button" data-layer="park" aria-pressed="true">
        <span class="big num" id="nPark">–</span><span class="sw sw-park"></span><span class="lbl">Plazas libres</span>
      </button>
      <button class="layer" type="button" data-layer="cortes" aria-pressed="true">
        <span class="big num" id="nCortes">–</span><span class="sw sw-corte"></span><span class="lbl">Cortes y obras</span>
      </button>
      <button class="layer" type="button" data-layer="cams" aria-pressed="true">
        <span class="big num" id="nCams">–</span><span class="sw sw-cam"></span><span class="lbl">Cámaras</span>
      </button>
      <button class="layer wide extra" type="button" data-layer="stops" aria-pressed="true">
        <span class="sw sw-stop"></span><span class="lbl"><span class="num" id="nStops">–</span> paradas de autobús</span><span class="hint" id="stopHint"></span>
      </button>
    </div>

    <div class="extra">
      <div class="row">
        <label for="lineSel">Línea</label>
        <select id="lineSel"><option value="">Todas las líneas</option></select>
        <button id="lineClear" type="button" hidden>Ver todas</button>
      </div>
      <div id="lineInfo" hidden></div>
    </div>

    <div id="clima" class="extra">
      <div class="c"><span class="k">Tiempo</span><span id="cTiempo">–</span></div>
      <div class="c"><span class="k">Aire</span><span id="cAire">–</span></div>
      <div class="c"><span class="k">Mar</span><span id="cMar">–</span></div>
    </div>

    <div id="foot" class="extra">
      La EMT publica la posición de sus autobuses cada 5 minutos; entre lecturas, el mapa la estima sobre el recorrido de la línea.
      Datos: <a href="https://datosabiertos.malaga.eu" target="_blank" rel="noopener">Ayuntamiento de Málaga</a> (CC BY 4.0) y
      <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.
    </div>
  </section>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.NumberFormat('es-ES', { useGrouping: 'always' });
  var dec1 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var css = function (name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); };
  var ancho = function () { return innerWidth > 720; };

  if (!window.maplibregl) { $('statusText').textContent = 'No se ha podido cargar el mapa. Recarga la página.'; return; }

  // ---------- Mapa base ----------
  // Mapa vectorial de OpenFreeMap con edificios en 3D. Si no se puede descargar (por ejemplo, en la
  // copia guardada sin conexión), se usa el mapa plano que acompaña a la página.
  var VECTOR = { light: 'https://tiles.openfreemap.org/styles/liberty', dark: 'https://tiles.openfreemap.org/styles/dark' };
  var esOscuro = function () { var t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  var es3D = false;

  function estiloPlano() {
    var base = new URL('tiles/', location.href).href;
    return { version: 8, sources: { base: { type: 'raster', tiles: [base + '{z}/{x}/{y}.png'], tileSize: 256, minzoom: 11, maxzoom: 15,
      attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' } },
      layers: [{ id: 'fondo', type: 'background', paint: { 'background-color': css('--bg') } },
        { id: 'base', type: 'raster', source: 'base', paint: esOscuro()
          ? { 'raster-saturation': -.75, 'raster-brightness-max': .42, 'raster-contrast': .15 }
          : { 'raster-saturation': -.5, 'raster-contrast': -.05 } }] };
  }
  function cargarEstilo() {
    var oscuro = esOscuro();
    return fetch(VECTOR[oscuro ? 'dark' : 'light'], { signal: AbortSignal.timeout ? AbortSignal.timeout(7000) : undefined })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (st) {
        var capa3d = st.layers.filter(function (l) { return l.type === 'fill-extrusion'; })[0];
        if (capa3d) { capa3d.paint['fill-extrusion-color'] = css('--edificio'); capa3d.paint['fill-extrusion-opacity'] = .88; }
        else { // el estilo oscuro no trae edificios con altura: se añaden bajo los rótulos
          var i = st.layers.findIndex(function (l) { return l.type === 'symbol'; });
          st.layers.splice(i < 0 ? st.layers.length : i, 0, { id: 'edificios-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 14,
            paint: { 'fill-extrusion-color': css('--edificio'), 'fill-extrusion-height': ['get', 'render_height'], 'fill-extrusion-base': ['get', 'render_min_height'], 'fill-extrusion-opacity': .88 } });
        }
        es3D = true; return st;
      })
      .catch(function () { es3D = false; return estiloPlano(); });
  }

  var map, listo = false, popup = null;
  var VISTA = { center: [-4.4222, 36.7186], zoom: 15.1, pitch: 55, bearing: -18 };
  cargarEstilo().then(function (estilo) {
    map = new maplibregl.Map({ container: 'map', style: estilo, center: VISTA.center, zoom: es3D ? VISTA.zoom : 14, pitch: es3D ? VISTA.pitch : 0,
      bearing: es3D ? VISTA.bearing : 0, minZoom: 10.5, maxZoom: es3D ? 19 : 17, maxPitch: 70,
      maxBounds: [[-4.85, 36.50], [-4.05, 36.95]], attributionControl: false });
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    if (es3D) map.addControl({ // alterna entre la vista inclinada y la vista desde arriba
      onAdd: function () {
        var d = document.createElement('div'); d.className = 'maplibregl-ctrl maplibregl-ctrl-group';
        d.innerHTML = '<button id="vista" type="button" title="Cambiar entre vista 3D y plana">2D</button>';
        d.firstChild.addEventListener('click', function () {
          var plano = map.getPitch() > 5;
          map.easeTo({ pitch: plano ? 0 : VISTA.pitch, bearing: plano ? 0 : VISTA.bearing, duration: 700 });
          this.textContent = plano ? '3D' : '2D';
        });
        return d;
      }, onRemove: function () {} }, 'bottom-right');
    map.setPadding(ancho() ? { left: 370, top: 0, right: 0, bottom: 0 } : { left: 0, top: 0, right: 0, bottom: 190 });
    map.on('style.load', function () { listo = true; pintarCapas(); });
    map.on('zoom', pista);
    ['stops', 'cams'].forEach(function (c) {
      map.on('mouseenter', c, function () { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', c, function () { map.getCanvas().style.cursor = ''; });
    });
    map.on('click', 'stops', function (e) { var s = stops[e.features[0].properties.id]; if (s) abrir([s.lon, s.lat], popParada(s)); });
    map.on('click', 'cams', function (e) { var c = cams[e.features[0].properties.i]; if (c) abrir([c.lon, c.lat], popCam(c), 300); });
    arrancar();
  });
  function reestilar() { if (map) cargarEstilo().then(function (st) { listo = false; map.setStyle(st); }); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reestilar);
  new MutationObserver(reestilar).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function abrir(lngLat, html, maxw) {
    if (popup) popup.remove();
    popup = new maplibregl.Popup({ offset: 14, maxWidth: (maxw || 280) + 'px' }).setLngLat(lngLat).setHTML(html).addTo(map);
  }
  function marcador(clase, html, lngLat, alPulsar) {
    var el = document.createElement('div'); el.className = 'mk ' + clase; el.innerHTML = html;
    el.addEventListener('click', function (e) { e.stopPropagation(); alPulsar(); });
    return new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
  }

  var shown = { buses: true, park: true, cortes: true, cams: true, stops: true };
  try { var saved = JSON.parse(localStorage.getItem('capas') || '{}'); for (var k in shown) if (typeof saved[k] === 'boolean') shown[k] = saved[k]; } catch (e) {}

  // ---------- Geometría ----------
  var R = 6371000, RAD = Math.PI / 180;
  function dist(a, b) { // metros; suficiente a escala de ciudad
    var x = (b[1] - a[1]) * RAD * Math.cos((a[0] + b[0]) / 2 * RAD), y = (b[0] - a[0]) * RAD;
    return Math.sqrt(x * x + y * y) * R;
  }
  function makeRoute(pts) {
    var cum = [0];
    for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
    return { pts: pts, cum: cum, len: cum[cum.length - 1] || 0 };
  }
  // Proyecta un punto sobre el recorrido (opcionalmente solo entre dos distancias): devuelve la
  // distancia recorrida desde la cabecera y la separación del recorrido, ambas en metros.
  function project(route, p, desde, hasta) {
    var best = null, k = Math.cos(p[0] * RAD);
    for (var i = 1; i < route.pts.length; i++) {
      if (desde != null && route.cum[i] < desde) continue;
      if (hasta != null && route.cum[i - 1] > hasta) break;
      var a = route.pts[i - 1], b = route.pts[i];
      var ax = (a[1] - p[1]) * k, ay = a[0] - p[0], dx = (b[1] - a[1]) * k, dy = b[0] - a[0], l2 = dx * dx + dy * dy;
      var t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
      var cx = ax + t * dx, cy = ay + t * dy, off = Math.sqrt(cx * cx + cy * cy) * RAD * R;
      if (!best || off < best.off - .5) best = { s: route.cum[i - 1] + t * (route.cum[i] - route.cum[i - 1]), off: off };
    }
    return best;
  }
  function pointAt(route, s) {
    s = Math.max(0, Math.min(route.len, s));
    var lo = 1, hi = route.cum.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (route.cum[mid] < s) lo = mid + 1; else hi = mid; }
    var seg = route.cum[lo] - route.cum[lo - 1], t = seg ? (s - route.cum[lo - 1]) / seg : 0, a = route.pts[lo - 1], b = route.pts[lo];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  function descomprimir(g) { // enteros en diferencias -> [lat, lon]
    var pts = [], la = 0, lo = 0;
    for (var i = 0; i < g.length; i += 2) { la += g[i]; lo += g[i + 1]; pts.push([la / 1e5, lo / 1e5]); }
    return pts;
  }

  // ---------- Líneas y paradas ----------
  var lines = {}, stops = {}, selected = null;
  function colorDe(i) { return 'hsl(' + Math.round((i * 137.508 + 200) % 360) + ' ' + (i % 2 ? 62 : 74) + '% ' + (i % 3 ? 38 : 31) + '%)'; }
  function textoSobre(hex) { // texto oscuro sobre los colores claros de la EMT
    var n = parseInt(hex.slice(1), 16), lum = (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255;
    return lum > .62 ? '#13222c' : '#fff';
  }
  var estiloLinea = function (l) { return '--c:' + l.color + ';--t:' + l.texto; };

  function loadLines(d) {
    d.stops.forEach(function (s) { s.lines = []; stops[s.id] = s; });
    d.lines.forEach(function (l, i) {
      l.color = l.col || colorDe(i); l.texto = l.col ? textoSobre(l.col) : '#fff';
      l.routes = {}; l.stopS = {};
      ['1', '2'].forEach(function (dir) {
        var ids = (l.r[dir] || []).filter(function (id) { return stops[id]; });
        ids.forEach(function (id) { if (stops[id].lines.indexOf(l) < 0) stops[id].lines.push(l); });
        // Recorrido real por las calles si la EMT lo publica; si no, las paradas unidas en línea recta.
        var pts = l.g && l.g[dir] ? descomprimir(l.g[dir]) : ids.map(function (id) { return [stops[id].lat, stops[id].lon]; });
        if (pts.length < 2) return;
        var route = l.routes[dir] = makeRoute(pts); route.real = !!(l.g && l.g[dir]);
        var prev = 0, sm = l.stopS[dir] = {};
        ids.forEach(function (id) { // distancia de cada parada a lo largo del recorrido, en orden
          var pr = project(route, [stops[id].lat, stops[id].lon], prev, prev + 2500) || project(route, [stops[id].lat, stops[id].lon]);
          if (pr) { sm[id] = pr.s; prev = pr.s; }
        });
      });
      lines[l.c] = l;
      var o = document.createElement('option'); o.value = l.c; o.textContent = l.u + ' · ' + l.n; $('lineSel').appendChild(o);
    });
    $('nStops').textContent = fmt.format(d.stops.length);
    pintarCapas();
  }
  function popParada(s) {
    return '<div class="pop"><h3>' + esc(s.n) + '</h3><div class="sub">Parada ' + s.id + (s.d ? ' · ' + esc(s.d) : '') + '</div>' +
      '<div class="chips">' + s.lines.map(function (l) { return '<button class="chip" type="button" style="' + estiloLinea(l) + '" data-line="' + l.c + '" title="' + esc(l.n) + '">' + esc(l.u) + '</button>'; }).join('') + '</div></div>';
  }

  // ---------- Capas dibujadas en el mapa: recorrido, paradas y cámaras ----------
  var cams = [];
  var punto = function (lon, lat, props) { return { type: 'Feature', properties: props, geometry: { type: 'Point', coordinates: [lon, lat] } }; };
  function datosCapas() {
    var ruta = [], ps = [];
    if (selected) ['1', '2'].forEach(function (dir) {
      var r = selected.routes[dir];
      if (r) ruta.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: r.pts.map(function (p) { return [p[1], p[0]]; }) } });
    });
    for (var id in stops) { var s = stops[id]; if (!selected || s.lines.indexOf(selected) >= 0) ps.push(punto(s.lon, s.lat, { id: s.id })); }
    return { route: ruta, stops: ps, cams: cams.map(function (c, i) { return punto(c.lon, c.lat, { i: i }); }) };
  }
  function pintarCapas() {
    if (!map || !listo) return;
    var d = datosCapas(), fc = function (f) { return { type: 'FeatureCollection', features: f }; };
    ['route', 'stops', 'cams'].forEach(function (n) {
      if (map.getSource(n)) map.getSource(n).setData(fc(d[n])); else map.addSource(n, { type: 'geojson', data: fc(d[n]) });
    });
    if (!map.getLayer('route')) {
      map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-width': 8, 'line-opacity': .9 } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-width': 5 } });
      map.addLayer({ id: 'cams', type: 'circle', source: 'cams', paint: { 'circle-radius': 4.5, 'circle-stroke-width': 2.5 } });
      map.addLayer({ id: 'stops', type: 'circle', source: 'stops', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 3, 16, 5], 'circle-stroke-width': 1.8 } });
    }
    map.setPaintProperty('route-casing', 'line-color', css('--panel'));
    map.setPaintProperty('route', 'line-color', selected ? selected.color : css('--accent'));
    map.setPaintProperty('cams', 'circle-color', css('--panel'));
    map.setPaintProperty('cams', 'circle-stroke-color', css('--cam'));
    map.setPaintProperty('stops', 'circle-color', css('--stop-fill'));
    map.setPaintProperty('stops', 'circle-stroke-color', selected ? selected.color : css('--stop'));
    map.setLayerZoomRange('stops', selected ? 0 : 14.5, 24);
    map.setLayoutProperty('stops', 'visibility', shown.stops ? 'visible' : 'none');
    map.setLayoutProperty('cams', 'visibility', shown.cams ? 'visible' : 'none');
    pista();
  }
  function pista() { $('stopHint').textContent = map && shown.stops && !selected && map.getZoom() < 14.5 ? 'Acerca el mapa para verlas' : ''; }

  function selectLine(c, encuadrar) {
    selected = c === '' || c == null ? null : lines[c] || null;
    $('lineSel').value = selected ? selected.c : '';
    $('lineClear').hidden = !selected;
    var info = $('lineInfo');
    if (selected) {
      var todos = [], real = true;
      ['1', '2'].forEach(function (dir) { var r = selected.routes[dir]; if (r) { todos = todos.concat(r.pts); real = real && r.real; } });
      if (encuadrar && todos.length) {
        var b = new maplibregl.LngLatBounds();
        todos.forEach(function (p) { b.extend([p[1], p[0]]); });
        var cam = map.cameraForBounds(b, { padding: 50, bearing: map.getBearing(), maxZoom: 15.5 });
        if (cam) map.easeTo({ center: cam.center, zoom: cam.zoom - (map.getPitch() > 5 ? .4 : 0), duration: 900 }); // conserva la inclinación
      }
      var n = Object.keys(buses).filter(function (id) { return buses[id].c === selected.c; }).length;
      info.hidden = false;
      info.textContent = selected.ida + ' ↔ ' + selected.vuelta + ' · ' + n + (n === 1 ? ' autobús' : ' autobuses') + ' ahora.' +
        (real ? '' : ' La EMT no publica el trazado de esta línea: se dibuja uniendo las paradas.');
    } else info.hidden = true;
    for (var id in buses) dimBus(buses[id]);
    pintarCapas();
  }
  function dimBus(b) { b.el.classList.toggle('dim', !!selected && b.c !== selected.c); }

  // ---------- Autobuses ----------
  var buses = {}, busUpd = 0, busFetched = 0, live = false;
  var V_DEF = 3.4;      // m/s ≈ 12 km/h, velocidad comercial media: ya incluye paradas y semáforos
  var V_MAX = 11;       // m/s ≈ 40 km/h
  var MAX_AHEAD = 330;  // s: la fuente publica cada 5 min; más allá no se proyecta sin un dato nuevo

  function situar(line, x) { // posición del autobús sobre el recorrido de su línea y sentido
    var route = line && line.routes[String(x.s)];
    if (!route) return null;
    var p = [x.lat, x.lon], sp = line.stopS[String(x.s)][x.p], pr = null;
    if (sp != null) pr = project(route, p, sp - 200, sp + 2500); // cerca de su última parada registrada
    if (!pr || pr.off > 80) { var g = project(route, p); if (g && (!pr || g.off < pr.off - 30)) pr = g; }
    return pr && pr.off < 150 ? { route: route, s: pr.s } : null;
  }

  function loadBuses(d) {
    busFetched = d.t;
    live = Date.now() - d.t < 5 * 60000;
    var isNew = d.upd !== busUpd, seen = {};
    d.buses.forEach(function (x) {
      seen[x.id] = 1;
      var line = lines[x.c], b = buses[x.id];
      if (!b) {
        b = buses[x.id] = { id: x.id, v: V_DEF, medida: false };
        b.marker = marcador('bus-ic', '<div class="bus"></div>', [x.lon, x.lat], function () { abrir(b.marker.getLngLat(), busPopup(b)); });
        b.el = b.marker.getElement();
      }
      var pos = situar(line, x), mismo = b.upd && b.c === x.c && b.s === x.s;
      if (isNew && mismo && pos && b.route) {
        // Velocidad observada entre las dos últimas lecturas reales, suavizada con la anterior.
        var dt = (d.upd - b.upd) / 1000, adv = pos.s - b.s0;
        if (dt > 10) {
          var vObs = adv / dt;
          if (vObs < .35) { b.v = 0; b.medida = true; }  // parado en cabecera, regulando o en un atasco
          else if (vObs <= V_MAX * 1.3) { b.v = Math.min(V_MAX, .6 * vObs + .4 * (b.v || V_DEF)); b.medida = true; }
        }
      } else if (!mismo) { b.v = V_DEF; b.medida = false; }
      if (isNew || !b.upd) { b.upd = d.upd; b.lat = x.lat; b.lon = x.lon; b.s0 = pos ? pos.s : 0; b.route = pos ? pos.route : null; }
      b.c = x.c; b.s = x.s; b.p = x.p;
      var u = line ? line.u : String(x.c);
      if (b.label !== u) {
        b.label = u;
        var caja = b.el.firstChild; caja.textContent = u;
        caja.style.cssText = line ? estiloLinea(line) : '--c:' + css('--muted');
      }
      dimBus(b);
    });
    for (var id in buses) if (!seen[id]) { buses[id].marker.remove(); delete buses[id]; }
    busUpd = d.upd;
    $('nBuses').textContent = fmt.format(d.buses.length);
    tick();
  }

  function tick() {
    var now = Date.now();
    for (var id in buses) {
      var b = buses[id], ll = [b.lat, b.lon];
      b.est = false;
      if (live && b.route) { // siempre sobre la calle: el punto del recorrido donde debería ir ahora
        var age = Math.max(0, Math.min(MAX_AHEAD, (now - b.upd) / 1000));
        ll = pointAt(b.route, b.s0 + b.v * age); b.est = b.v > 0 && age > 5;
      }
      b.marker.setLngLat([ll[1], ll[0]]);
      b.el.classList.toggle('still', live && b.v === 0);
    }
    renderStatus();
  }
  function busPopup(b) {
    var l = lines[b.c], dest = l ? (b.s === 1 ? l.vuelta : l.ida) : '', st = stops[b.p];
    var age = Math.round((Date.now() - b.upd) / 1000);
    var note = !live ? 'Posición de la última lectura guardada.'
      : !b.route ? 'Fuera del recorrido habitual: se muestra su última posición real, de ' + ago(age) + '.'
      : b.v === 0 ? 'Parado desde la lectura anterior. Último dato real ' + ago(age) + '.'
      : b.est ? 'Posición estimada a ' + Math.round(b.v * 3.6) + ' km/h, ' + (b.medida ? 'su velocidad entre las dos últimas lecturas' : 'la media de la red') + '. Último dato real ' + ago(age) + '.'
      : 'Posición real, ' + ago(age) + '.';
    return '<div class="pop"><h3><span class="pill" style="' + (l ? estiloLinea(l) : '--c:' + css('--muted')) + '">' + esc(l ? l.u : b.c) + '</span> ' + (dest ? 'hacia ' + esc(dest) : 'Autobús') + '</h3>' +
      '<div class="sub">' + (l ? esc(l.n) : '') + '</div>' +
      '<p>Autobús n.º ' + esc(b.id) + (st ? '<br>Última parada registrada: ' + esc(st.n) : '') + '</p>' +
      (l ? '<p><a href="#" data-line="' + l.c + '">Ver el recorrido de la línea ' + esc(l.u) + '</a></p>' : '') +
      '<div class="note">' + note + '</div></div>';
  }
  function ago(s) { return s < 90 ? 'hace ' + s + ' s' : 'hace ' + Math.round(s / 60) + ' min'; }

  function renderStatus() {
    var st = $('status'), tx = $('statusText');
    if (!busFetched) return;
    if (!live) {
      st.className = '';
      tx.textContent = 'Instantánea del ' + new Date(busUpd).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }) + '. Sin conexión en directo.';
      return;
    }
    var age = Math.round((Date.now() - busUpd) / 1000);
    st.className = age < 420 ? 'live' : 'late';
    tx.textContent = (age < 420 ? 'En directo' : 'La fuente va con retraso') + ' · posición real de los autobuses ' + ago(age);
  }

  // ---------- Aparcamientos ----------
  var parkMarkers = [];
  function loadPark(d) {
    parkMarkers.forEach(function (m) { m.remove(); }); parkMarkers = [];
    var total = 0;
    d.list.forEach(function (p) {
      total += p.libres;
      var tok = p.libres < 20 ? '--bad' : p.libres < 60 ? '--warn' : '--good';
      var m = marcador('park-ic', '<div class="park num" style="--c:var(' + tok + ')"><i>P</i>' + p.libres + '</div>', [p.lon, p.lat], function () {
        abrir([p.lon, p.lat], '<div class="pop"><h3>Aparcamiento ' + esc(p.n) + '</h3><div class="sub">' + esc(p.d) + '</div>' +
          '<p><span class="fig num" style="color:var(' + tok + ')">' + fmt.format(p.libres) + '</span> plazas libres</p>' +
          '<div class="note">Aparcamiento público municipal.' + (p.aprox ? ' Ubicación aproximada: la fuente no da sus coordenadas.' : '') + '</div></div>');
      });
      m.getElement().style.zIndex = 3;
      parkMarkers.push(m);
    });
    $('nPark').textContent = fmt.format(total);
  }

  // ---------- Cortes ----------
  var corteMarkers = [];
  var fDate = function (ms) { return ms ? new Date(ms).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }) : '?'; };
  function loadCortes(d) {
    corteMarkers.forEach(function (m) { m.remove(); }); corteMarkers = [];
    var now = Date.now(), n = 0;
    d.list.forEach(function (c) {
      if (c.hasta && c.hasta < now) return;
      var futuro = c.desde && c.desde > now, total = c.af === 'Corte', tok = total ? '--bad' : '--warn';
      if (!futuro) n++;
      corteMarkers.push(marcador('corte-ic', '<div class="corte' + (futuro ? ' futuro' : '') + '" style="--c:var(' + tok + ')"></div>', [c.lon, c.lat], function () {
        abrir([c.lon, c.lat], '<div class="pop"><h3>' + esc(c.af || 'Afección al tráfico') + '</h3><div class="sub">' + esc([c.tipo, c.dir].filter(Boolean).join(' · ')) + '</div>' +
          '<p>' + esc(c.d) + '</p><p><span class="tag" style="background:var(' + (futuro ? '--muted' : tok) + ')">' + (futuro ? 'Programado' : 'En vigor') + '</span> ' +
          'Del ' + fDate(c.desde) + ' al ' + fDate(c.hasta) + '</p>' + (c.nota ? '<div class="note">' + esc(c.nota) + '</div>' : '') + '</div>', 290);
      }));
    });
    $('nCortes').textContent = fmt.format(n);
  }

  // ---------- Cámaras ----------
  function loadCams(d) { cams = d.list; $('nCams').textContent = fmt.format(cams.length); pintarCapas(); }
  function popCam(c) {
    return '<div class="pop"><h3>' + esc(c.d || c.n) + '</h3><div class="sub">' + esc(c.n) + '</div>' +
      (c.img ? '<img alt="Imagen de la cámara" src="' + esc(c.img) + '?t=' + Math.floor(Date.now() / 30000) + '" onerror="this.outerHTML=\'<p class=&quot;sub&quot;>La imagen no se puede mostrar aquí.</p>\'">' : '') +
      (c.url ? '<p><a href="' + esc(c.url) + '" target="_blank" rel="noopener">Abrir la cámara en movilidad.malaga.eu</a></p>' : '') + '</div>';
  }

  // ---------- Clima ----------
  var WMO = { 0: 'Despejado', 1: 'Poco nuboso', 2: 'Intervalos nubosos', 3: 'Nublado', 45: 'Niebla', 48: 'Niebla', 51: 'Llovizna débil', 53: 'Llovizna', 55: 'Llovizna intensa',
    61: 'Lluvia débil', 63: 'Lluvia', 65: 'Lluvia fuerte', 80: 'Chubascos débiles', 81: 'Chubascos', 82: 'Chubascos fuertes', 95: 'Tormenta', 96: 'Tormenta con granizo', 99: 'Tormenta con granizo' };
  var ROSA = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
  var rumbo = function (g) { return ROSA[Math.round(g / 45) % 8]; };
  function loadClima(d) {
    if (d.w) $('cTiempo').innerHTML = '<b class="num">' + Math.round(d.w.temperature_2m) + ' °C</b> · ' + (WMO[d.w.weather_code] || 'Variable') +
      ' · viento ' + Math.round(d.w.wind_speed_10m) + ' km/h del ' + rumbo(d.w.wind_direction_10m);
    if (d.a) {
      var q = d.a.european_aqi, lv = q <= 20 ? ['Bueno', '--good'] : q <= 40 ? ['Aceptable', '--good'] : q <= 60 ? ['Moderado', '--warn'] : q <= 80 ? ['Malo', '--bad'] : ['Muy malo', '--bad'];
      $('cAire').innerHTML = '<span class="tag" style="background:var(' + lv[1] + ')">' + lv[0] + '</span> índice europeo <b class="num">' + q + '</b> · NO₂ ' + dec1.format(d.a.nitrogen_dioxide) + ' µg/m³';
    }
    if (d.m) $('cMar').innerHTML = 'Olas de <b class="num">' + dec1.format(d.m.wave_height) + ' m</b> del ' + rumbo(d.m.wave_direction) +
      ' · agua a <b class="num">' + dec1.format(d.m.sea_surface_temperature) + ' °C</b>';
  }

  // ---------- Capas e interacción ----------
  function applyLayer(name) {
    document.querySelector('[data-layer="' + name + '"]').setAttribute('aria-pressed', String(shown[name]));
    $('map').classList.toggle('hide-' + name, !shown[name]);
    pintarCapas();
  }
  document.querySelectorAll('.layer').forEach(function (btn) {
    var name = btn.dataset.layer; applyLayer(name);
    btn.addEventListener('click', function () {
      shown[name] = !shown[name]; applyLayer(name);
      try { localStorage.setItem('capas', JSON.stringify(shown)); } catch (e) {}
    });
  });
  $('lineSel').addEventListener('change', function () { selectLine(this.value, true); });
  $('lineClear').addEventListener('click', function () { selectLine(null); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-line]'); if (!t) return;
    e.preventDefault(); if (popup) popup.remove(); selectLine(t.dataset.line, true);
  });
  $('more').addEventListener('click', function () {
    var open = $('panel').classList.toggle('open');
    this.textContent = open ? 'Menos' : 'Más'; this.setAttribute('aria-expanded', String(open));
  });

  // ---------- Carga y refresco ----------
  function get(name) { return fetch('data/' + name + '.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function every(name, fn, secs) {
    var run = function () {
      get(name).then(fn).catch(function () { if (name === 'buses' && !busFetched) $('statusText').textContent = 'No llegan datos. Se reintentará en breve.'; })
        .then(function () { setTimeout(run, (live ? secs : Math.max(secs, 300)) * 1000); });
    };
    run();
  }
  function arrancar() {
    get('lineas').then(loadLines).catch(function () {}).then(function () {
      every('buses', loadBuses, 20);
      setInterval(tick, 1000);
    });
    every('aparcamientos', loadPark, 60);
    every('cortes', loadCortes, 600);
    every('camaras', loadCams, 3600);
    every('clima', loadClima, 600);
  }
})();
</script>
